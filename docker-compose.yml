version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: votepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-votepulse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-votepulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - votepulse-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: votepulse-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-votepulse}
      SECRET_KEY: ${SECRET_KEY:-votepulse-super-secret-production-key-2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-votepulse-jwt-secret-production-key-2026}
      JWT_EXPIRES_HOURS: 24
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-brmovs}
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:-7025919468}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-qw1988ab1988}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-System Administrator}
      CORS_ORIGINS: "*"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - votepulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: votepulse-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - votepulse-net

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  votepulse-net:
    driver: bridge
